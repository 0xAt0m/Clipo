name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ffmpeg (capture d'écran, encodage, export) est livré dans l'installateur.
      - name: Télécharger ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "ffmpeg-n*-latest-win64-gpl-[0-9]*.zip" --dir ffdl
          $zip = Get-ChildItem ffdl/*.zip | Sort-Object Name | Select-Object -Last 1
          Expand-Archive $zip.FullName -DestinationPath ffx
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force app/resources | Out-Null
          Copy-Item $exe.FullName app/resources/ffmpeg.exe
          & app/resources/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Tests du moteur
        run: cargo test -p clipo-core

      # Informatif : la machine de build n'a ni carte graphique ni vrai écran.
      - name: Diagnostic de la capture
        continue-on-error: true
        run: cargo run -q -p clipo-core --bin diagnose -- app/resources/ffmpeg.exe

      - name: Installer la CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construire l'installateur
        working-directory: app
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Clipo-installateur
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
