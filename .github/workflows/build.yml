name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ffmpeg (capture d'écran, encodage, export) est livré dans l'installateur.
      - name: Télécharger ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "ffmpeg-n*-latest-win64-gpl-[0-9]*.zip" --dir ffdl
          $zip = Get-ChildItem ffdl/*.zip | Sort-Object Name | Select-Object -Last 1
          Expand-Archive $zip.FullName -DestinationPath ffx
          $exe = Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force app/resources | Out-Null
          Copy-Item $exe.FullName app/resources/ffmpeg.exe
          & app/resources/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Tests du moteur
        run: cargo test -p clipo-core

      # Informatif : la machine de build n'a ni carte graphique ni vrai écran.
      - name: Diagnostic de la capture
        continue-on-error: true
        run: cargo run -q -p clipo-core --bin diagnose -- app/resources/ffmpeg.exe

      - name: Installer la CLI Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construire l'installateur
        working-directory: app
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Clipo-installateur
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Publie une release pour chaque tag v*, et pour chaque nouvelle version poussée
      # sur main (numéro lu dans app/tauri.conf.json, tag créé s'il n'existe pas).
      - name: Version à publier
        id: version
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $publish = 'true'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v' + (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
            gh release view $tag --repo '${{ github.repository }}' *> $null
            if ($LASTEXITCODE -eq 0) { $publish = 'false' }
          }
          New-Item -ItemType Directory -Force notes | Out-Null
          if (-not (Test-Path "notes/$tag.md")) { Set-Content "notes/$tag.md" "Clipo $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Version $tag, publication : $publish"
          exit 0

      - name: Publier la version
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Clipo ${{ steps.version.outputs.tag }}
          body_path: notes/${{ steps.version.outputs.tag }}.md
          files: target/release/bundle/nsis/*.exe
