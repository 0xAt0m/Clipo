<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand"><img src="icon.png" alt=""><span>Clipo</span></div>
  <button id="status" class="pill" title="Mettre le buffer en pause ou le reprendre">
    <i class="dot"></i><span id="status-text">Démarrage…</span>
  </button>
  <div class="spacer"></div>
  <button id="btn-clip" class="btn primary">Enregistrer un clip</button>
  <button id="btn-settings" class="btn icon" title="Réglages" aria-label="Réglages">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<!-- Bibliothèque -->
<main id="library">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <h2>Aucun clip pour l'instant</h2>
    <p>En jeu, appuyez sur <kbd id="empty-key">Alt + F10</kbd> pour garder <span id="empty-len">les 60 dernières secondes</span>.</p>
  </div>
</main>

<!-- Éditeur -->
<main id="editor" hidden>
  <div class="ed-head">
    <button id="ed-back" class="btn ghost">← Clips</button>
    <h1 id="ed-title"></h1>
    <div class="spacer"></div>
    <button id="ed-export" class="btn primary">Exporter</button>
  </div>
  <div class="ed-body">
    <div class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" playsinline preload="auto"></video>
        <div id="overlays"></div>
      </div>
    </div>
    <aside class="side">
      <section id="tracks-panel">
        <h3>Son</h3>
        <div id="tracks"></div>
      </section>
      <section id="inspector" hidden>
        <h3 id="insp-title">Calque</h3>
        <div id="insp-body"></div>
      </section>
    </aside>
  </div>
  <div class="transport">
    <button id="play" class="btn icon round" title="Lecture (Espace)" aria-label="Lecture">▶</button>
    <span id="time" class="time">0:00.0 / 0:00.0</span>
    <div class="sep"></div>
    <button id="t-split" class="btn" title="Couper à la tête de lecture (S)">Couper</button>
    <button id="t-delete" class="btn" title="Supprimer la sélection (Suppr)">Supprimer</button>
    <button id="t-undo" class="btn" title="Annuler (Ctrl+Z)">Annuler</button>
    <div class="spacer"></div>
    <button id="t-text" class="btn">+ Texte</button>
    <button id="t-image" class="btn">+ Image</button>
    <button id="t-video" class="btn">+ Vidéo</button>
  </div>
  <div id="timeline" class="timeline">
    <div id="tl-pieces" class="lane pieces"></div>
    <div id="tl-overlays" class="lane ovs"></div>
    <div id="playhead"></div>
  </div>
  <p class="hint">Pour retirer un passage : <b>Couper</b> au début, <b>Couper</b> à la fin, cliquer le morceau, puis <b>Supprimer</b>.</p>
</main>

<!-- Réglages -->
<div id="settings" class="modal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h2>Réglages</h2><button class="btn icon" data-close aria-label="Fermer">✕</button></div>
    <div class="sheet-body">
      <h3>Clip</h3>
      <label class="row"><span>Durée gardée</span>
        <select id="s-buffer">
          <option value="15">15 secondes</option><option value="30">30 secondes</option>
          <option value="60">1 minute</option><option value="120">2 minutes</option>
          <option value="180">3 minutes</option><option value="300">5 minutes</option>
          <option value="600">10 minutes</option>
        </select></label>
      <label class="row"><span>Raccourci</span><button id="s-hotkey" class="btn key"></button></label>
      <label class="row"><span>Dossier</span><button id="s-dir" class="btn path"></button></label>

      <h3>Son</h3>
      <label class="row"><span>Piste « Jeu » <small>tout le son du PC sauf le vocal</small></span><input type="checkbox" id="s-game"></label>
      <label class="row"><span>Piste « Vocal »</span><input type="checkbox" id="s-voice"></label>
      <label class="row sub"><span>Application</span><input type="text" id="s-voiceapp" spellcheck="false"></label>
      <label class="row"><span>Piste « Micro »</span><input type="checkbox" id="s-mic-on"></label>
      <label class="row sub"><span>Périphérique</span><select id="s-mic"></select></label>

      <h3>Vidéo</h3>
      <label class="row"><span>Résolution</span>
        <select id="s-height"><option value="0">Native (le plus léger)</option><option value="1080">1080p</option><option value="720">720p</option></select></label>
      <label class="row"><span>Images par seconde</span>
        <select id="s-fps"><option value="60">60</option><option value="30">30</option></select></label>
      <label class="row"><span>Qualité <small id="s-bitrate-val"></small></span><input type="range" id="s-bitrate" min="4" max="50" step="1"></label>
      <label class="row"><span>Écran</span>
        <select id="s-monitor"><option value="0">Principal</option><option value="1">Écran 2</option><option value="2">Écran 3</option></select></label>
      <label class="row"><span>Afficher le curseur</span><input type="checkbox" id="s-cursor"></label>

      <h3>Application</h3>
      <label class="row"><span>Lancer avec Windows <small>réduit dans la zone de notification</small></span><input type="checkbox" id="s-autostart"></label>
      <label class="row"><span>Décalage du son <small id="s-offset-val"></small></span><input type="range" id="s-offset" min="-300" max="300" step="10"></label>
      <p class="note" id="s-encoder"></p>
    </div>
  </div>
</div>

<!-- Export -->
<div id="exporting" class="modal" hidden>
  <div class="sheet small">
    <h2>Export en cours…</h2>
    <div class="bar"><i id="export-bar"></i></div>
  </div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
